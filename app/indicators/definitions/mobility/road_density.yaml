indicator_id: road_density
domain: mobility
display_label: Road density
purpose: Total mapped carriageway length per square kilometre of analysis area.
goals: [concentration]
method_id: length_density
formula: "sum(length(highway features)) / area(analysis_area)"
unit: km_per_km2
display_precision: 2
direction: higher_is_better
min_observations: 1
status: experimental
since_catalog_version: indicator-catalog-1
requirements:
  - requirement_id: highway_features
    kind: osm_features
    source: openstreetmap
    feature_spec:
      geometry: line
      element_types: [way]
      categories:
        - id: carriageway
          label: Carriageway
          tags:
            - "highway=motorway"
            - "highway=trunk"
            - "highway=primary"
            - "highway=secondary"
            - "highway=tertiary"
            - "highway=unclassified"
            - "highway=residential"
            - "highway=living_street"
          tag_match: any
      documentation:
        - title: Map Features
          url: "https://wiki.openstreetmap.org/wiki/Map_Features"
  - requirement_id: analysis_area
    kind: analysis_area
    source: derived
limitations:
  - osm_completeness
  - scope_definition_affects_results
  - polygon_geometry_partially_available
references:
  - citation: "UN-Habitat (2013). Streets as public spaces and drivers of urban prosperity. Road density as length per area."
