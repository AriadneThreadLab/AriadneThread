indicator_id: green_diversity
domain: green_space
display_label: Green space type diversity
purpose: Evenness of green-space types present in the analysis area.
goals: [variability]
method_id: shannon_entropy
formula: "H = -sum(p_i * ln(p_i)) over green-space categories i"
parameters:
  log_base: 2.718281828459045
unit: nats
display_precision: 2
direction: higher_is_better
min_observations: 2
status: experimental
since_catalog_version: indicator-catalog-1
requirements:
  - requirement_id: green_polygons
    kind: osm_features
    source: openstreetmap
    feature_spec:
      geometry: polygon
      element_types: [way, relation]
      categories:
        - id: park
          label: Park
          tags: ["leisure=park"]
        - id: garden
          label: Garden
          tags: ["leisure=garden"]
        - id: grass
          label: Grass
          tags: ["landuse=grass"]
        - id: wood
          label: Wood
          tags: ["natural=wood"]
      documentation:
        - title: "Tag: leisure=park"
          url: "https://wiki.openstreetmap.org/wiki/Tag:leisure%3Dpark"
        - title: "Tag: landuse=grass"
          url: "https://wiki.openstreetmap.org/wiki/Tag:landuse%3Dgrass"
limitations:
  - osm_completeness
  - nonstandard_property_values
  - count_is_not_capacity
references:
  - citation: "Shannon, C. E. (1948). A mathematical theory of communication. Bell System Technical Journal, 27, 379–423."
